plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

dependencies {
    // The BOM keeps every Jackson module on one version; the validator was built against an older 2.x.
    implementation platform('com.fasterxml.jackson:jackson-bom:2.22.3')
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.networknt:json-schema-validator:1.5.9'
    // Silences the validator's logging, so the report is the only output.
    runtimeOnly 'org.slf4j:slf4j-nop:2.0.17'

    testImplementation 'org.testng:testng:7.12.0'
}

// The release gate, test T-01: ./gradlew test. A passed test is GO, a failed test is NO-GO.
test {
    useTestNG()
    // Shows the gate report on the console and in the CI log.
    testLogging.showStandardStreams = true
    // Gradle does not know that the test reads starter-pack/. Without this line it would skip the gate after a
    // GO and report "up to date", even when the recorded outputs have changed.
    outputs.upToDateWhen { false }
}
